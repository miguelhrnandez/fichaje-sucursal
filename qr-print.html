<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Fijo para Imprimir</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.print-card {
  background: white;
  border-radius: 24px;
  padding: 60px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
  text-align: center;
  max-width: 500px;
  width: 100%;
}

.title {
  font-size: 32px;
  font-weight: 800;
  color: #1a1a2e;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}

.subtitle {
  font-size: 16px;
  color: #666;
  margin-bottom: 32px;
}

.qr-wrap {
  background: white;
  padding: 24px;
  border-radius: 20px;
  display: inline-block;
  border: 4px solid #0f3460;
}

#qrcode img { display: block; }

.instructions {
  margin-top: 32px;
  padding: 20px;
  background: #f9f9f9;
  border-radius: 16px;
  font-size: 14px;
  color: #555;
  line-height: 1.6;
  text-align: left;
}

.instructions strong { color: #0f3460; }

.btn-print {
  margin-top: 24px;
  padding: 14px 32px;
  background: linear-gradient(135deg, #4ade80, #22d3ee);
  color: #0f3460;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

@media print {
  body { background: white; }
  .print-card { box-shadow: none; padding: 40px; }
  .instructions, .btn-print { display: none; }
}
</style>
</head>
<body>

<div class="print-card">
  <div class="title">FICHAJE</div>
  <div class="subtitle">Escaneá este código para fichar</div>

  <div class="qr-wrap">
    <div id="qrcode"></div>
  </div>

  <div class="instructions">
    <strong>Para imprimir:</strong><br>
    1. Apretá el botón "Imprimir QR"<br>
    2. Configurá tamaño: A5 o A4<br>
    3. Pegalo en la pared del local en un lugar visible
  </div>

  <button class="btn-print" onclick="window.print()">🖨️ Imprimir QR</button>
</div>

<script>
const QR_CODE = 'FICHAJE-SUCURSAL-2026';

new QRCode(document.getElementById('qrcode'), {
  text: QR_CODE,
  width: 300,
  height: 300,
  colorDark: '#0f3460',
  colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.H
});
</script>

</body>
</html>
